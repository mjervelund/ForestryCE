modLoader = "javafml"
loaderVersion = "{fmlVersionRange}"
issueTrackerURL = "https://github.com/thedarkcolour/ForestryCE/issues"

license = "GNU Lesser Public License v3"

[[mods]]
modId = "forestry"
version = "${version}"
displayName = "Forestry"
displayURL = "https://github.com/thedarkcolour/ForestryCE"
logoFile = "forestry-ce-logo-banner.png"
credits = "mistaqur, Binnie, CovertJaguar, MysteriousAges, Nirek, Temp1011, ramidzkh, EnderiumSmith, Spearkiller"
authors = "thedarkcolour, SirSengir, mezz, Nedelosk"
description ='''
Trees, bees and more.
'''

[[dependencies.forestry]]
modId = "neoforge"
mandatory = true
versionRange = "${forgeVersionRange}"
ordering = "NONE"
side = "BOTH"

[[dependencies.forestry]]
modId = "patchouli"
# 26.3 port: no 26.3 Patchouli exists and the compat package is excluded from compile.
type = "OPTIONAL"
versionRange = "${patchouliVersionRange}"
ordering = "NONE"
side = "BOTH"

[[dependencies.forestry]]
modId = "jei"
type = "OPTIONAL"
versionRange = "${jeiVersionRange}"
ordering = "NONE"
side = "CLIENT"
